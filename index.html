<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="description" content="Reach a target value on a tally counter with the fewest increments and the shortest reset path." />
    <title>Tally Puzzle Optimizer</title>
    <base data-trunk-public-url />
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="tally-gui" data-cargo-no-default-features data-cargo-features="gui" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1e1e2e;
        color: #cdd6f4;
        font-family: system-ui, sans-serif;
        color-scheme: dark;
      }

      #iced {
        display: grid;
        height: 100%;
        place-content: center;
        text-align: center;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      noscript {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="iced" role="status">Loading Tally Puzzle Optimizer…</div>
    <noscript>Please enable JavaScript to use Tally Puzzle Optimizer.</noscript>
  </body>
</html>
